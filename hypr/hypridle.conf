general {
    lock_cmd = /home/jm/.config/hypr/omarchy-lock.sh     # lock custom: hyprlock morado + batería
    before_sleep_cmd = /home/jm/.config/hypr/omarchy-lock.sh    # lock before suspend
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 5 minutes
listener {
    timeout = 300
    on-timeout = pidof hyprlock || omarchy-launch-screensaver
}

# Lock system 1 minute after the screensaver starts
listener {
    timeout = 360
    on-timeout = /home/jm/.config/hypr/omarchy-lock.sh
    on-resume = omarchy-system-wake
}
