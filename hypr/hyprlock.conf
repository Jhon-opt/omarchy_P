source = ~/.config/omarchy/current/theme/hyprlock.conf

$color = rgba(30, 15, 60, 1.0)
$inner_color = rgba(35, 18, 70, 0.85)
$outer_color = rgba(170, 120, 255, 1.0)
$font_color = rgba(255, 255, 255, 1.0)
$check_color = rgba(200, 160, 255, 1.0)

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_passes = 6
    blur_size = 8
}

label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##aa78ff'>$(date +%H)</span><span foreground='##ffffff'>:$(date +%M)</span>"
    color = $font_color
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %d de %B"
    color = $font_color
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 650, 100
    position = 0, -120
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $outer_color
    outline_thickness = 6
    shadow_passes = 4
    shadow_size = 8
    shadow_color = rgba(170, 120, 255, 0.55)
    shadow_boost = 1.2

    font_family = JetBrainsMono Nerd Font
    font_color = $font_color

    placeholder_text = Escribe tu contraseña
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 16
    fade_on_empty = false
}

animations {
    enabled = true
    bezier = mybezier, 0.05, 0.9, 0.1, 1.0
    animation = fade, 1, 1.8, mybezier
    animation = inputField, 1, 1.0, mybezier
}

auth {
    fingerprint:enabled = false
}